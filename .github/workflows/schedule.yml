name: Instagram Story Monitor

on:
  schedule:
    # هر ۶ ساعت: ساعت ۰، ۶، ۱۲، ۱۸ (به وقت UTC)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:  # امکان اجرای دستی برای تست

jobs:
  check_story:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          TARGET_USERNAME: ${{ secrets.TARGET_USERNAME }}
        run: python main.py
